name: Build and Verify APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for z in *.zip; do
            unzip -q -o "$z"
          done
          test -f idea-management-app/package.json
          test -f idea-management-app/package-lock.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: idea-management-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: idea-management-app

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        working-directory: idea-management-app

      - name: Build release APK for all default ABIs
        run: chmod +x gradlew && ./gradlew :app:assembleRelease --stacktrace
        working-directory: idea-management-app/android

      - name: Verify APK integrity, package, and signature
        shell: bash
        run: |
          set -euo pipefail
          apk=idea-management-app/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -tqq "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$tools/apksigner"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" | grep -E '^package:|^sdkVersion:|^native-code:'

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test APK installation on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            adb install -r idea-management-app/android/app/build/outputs/apk/release/app-release.apk
            adb shell pm path com.localfirst.ideavault

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: idea-vault-apk
          path: idea-management-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}-${{ github.run_attempt }}" \
            idea-management-app/android/app/build/outputs/apk/release/app-release.apk \
            --title "Idea Vault build ${{ github.run_number }}" \
            --notes "APK passed integrity/signature checks and emulator installation test. For internal testing; not production-signed."
